<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070d18">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MUI · Clicker Remoto v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #070d18;
      --card: #0e1726;
      --card-border: #1e293b;
      --lima: #aceb05;
      --lima-glow: rgba(172, 235, 5, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 14px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--lima);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      transition: all 0.3s ease;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .badge.error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .connected .dot {
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Slide Info Card (Compact) */
    .info-card {
      margin: 10px 0 10px 0;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .info-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .slide-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      color: var(--lima);
      letter-spacing: -0.02em;
    }
    .slide-step {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .slide-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Navigation Controls (Compact & Ergonomic) */
    .nav-controls {
      display: flex;
      gap: 10px;
      height: 56px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .btn-touch {
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), background 0.2s ease, box-shadow 0.2s ease;
      -webkit-user-select: none;
    }
    .btn-touch:active {
      transform: scale(0.96);
    }

    .btn-prev {
      flex: 0 0 36%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.02em;
    }
    .btn-prev:active {
      background: #1e293b;
      border-color: #475569;
    }

    .btn-next {
      flex: 1;
      background: linear-gradient(135deg, #aceb05 0%, #8ac200 100%);
      color: #050b14;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(172, 235, 5, 0.25);
    }
    .btn-next:active {
      background: #99d200;
      box-shadow: 0 3px 12px rgba(172, 235, 5, 0.3);
    }

    /* Actionable Drawers Container */
    .drawers-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(14, 23, 38, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .drawers-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }
    .drawers-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drawers-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(172, 235, 5, 0.12);
      color: var(--lima);
      border: 1px solid rgba(172, 235, 5, 0.3);
    }
    .drawers-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }
    .drawers-list::-webkit-scrollbar { width: 4px; }
    .drawers-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    /* Individual Actionable Drawer Card Button */
    .drawer-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
      border-radius: 12px;
      background: #09101d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .drawer-btn:active {
      transform: scale(0.98);
      background: #131e33;
    }
    .drawer-btn.active {
      background: rgba(172, 235, 5, 0.12);
      border-color: var(--lima);
      box-shadow: 0 0 14px var(--lima-glow);
    }
    .drawer-btn-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .drawer-btn-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drawer-btn-code {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--lima);
      font-family: 'JetBrains Mono', monospace;
    }
    .drawer-btn-chip {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: #94a3b8;
    }
    .drawer-btn-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drawer-btn.active .drawer-btn-title {
      color: #fff;
      font-weight: 700;
    }
    .drawer-btn-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 10px;
    }
    .drawer-state-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--lima);
      color: #000;
      display: none;
    }
    .drawer-btn.active .drawer-state-tag {
      display: block;
    }
    .drawer-btn-icon {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: color 0.15s ease;
    }
    .drawer-btn.active .drawer-btn-icon {
      color: var(--lima);
    }
    .drawer-empty {
      margin: auto;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      padding: 24px 12px;
      line-height: 1.5;
    }
    .drawer-empty svg {
      width: 24px;
      height: 24px;
      margin-bottom: 6px;
      opacity: 0.5;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .tool-btn {
      flex: 1;
      padding: 9px 8px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tool-btn:active { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
    .tool-btn.highlight {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    /* Setup form */
    .setup-box {
      margin: auto 0;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .setup-box h2 { font-size: 18px; font-weight: 700; }
    .setup-box p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .input-code {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #070d18;
      color: var(--lima);
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
    }
    .input-code:focus { border-color: var(--lima); box-shadow: 0 0 12px var(--lima-glow); }
    .btn-connect {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--lima);
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(14, 23, 38, 0.95);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span>MUI Clicker</span>
    </div>
    <div id="statusBadge" class="badge">
      <span class="dot"></span>
      <span id="statusText">Conectando...</span>
    </div>
  </header>

  <!-- Setup form if no Room ID was passed in URL -->
  <div id="setupView" class="setup-box" style="display: none;">
    <h2>Vincular con la Mac</h2>
    <p>Ingresá el código que figura en la pantalla de la presentación:</p>
    <input type="text" id="manualCode" class="input-code" placeholder="MUI-XXXX" maxlength="12" autocorrect="off" autocapitalize="characters">
    <button class="btn-connect" onclick="connectManual()">Conectar Control</button>
  </div>

  <!-- Main Clicker Controls View -->
  <div id="clickerView" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
    
    <!-- Compact Info Card -->
    <div class="info-card">
      <div class="info-top">
        <span class="slide-num" id="slideNum">-- / --</span>
        <span class="slide-step" id="slideStep">PASO 0</span>
      </div>
      <div class="slide-title" id="slideTitle">Sincronizando diapositiva...</div>
    </div>

    <!-- Compact Navigation Buttons (Side by Side) -->
    <div class="nav-controls">
      <button type="button" class="btn-touch btn-prev" onclick="sendCmd('prev')" id="btnPrev">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Anterior</span>
      </button>

      <button type="button" class="btn-touch btn-next" onclick="sendCmd('next')" id="btnNext">
        <span>Avanzar</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Actionable Drawers Section (Dynamic per slide) -->
    <div class="drawers-section">
      <div class="drawers-header">
        <span class="drawers-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
          Desplegables / Detalle
        </span>
        <span class="drawers-badge" id="drawersCount">0</span>
      </div>
      <div class="drawers-list" id="drawersList">
        <div class="drawer-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div>Sin desplegables en esta diapositiva</div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="tool-btn" onclick="sendCmd('home')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Inicio</span>
      </button>
      <button class="tool-btn" id="btnCloseDrawer" onclick="sendCmd('closeDrawer')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Cerrar Detalle</span>
      </button>
      <button class="tool-btn" onclick="connectMQTT()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Reconectar</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast">Notificación</div>

  <script>
    let client = null;
    let roomCode = '';
    let wakeLock = null;
    let currentDrawerOpen = null;
    let currentDrawersList = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function vibrate(ms = 35) {
      if (window.navigator && window.navigator.vibrate) {
        try { window.navigator.vibrate(ms); } catch (e) {}
      }
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });
    window.addEventListener('click', () => requestWakeLock(), { once: true });

    function getRoomCode() {
      const urlParams = new URLSearchParams(location.search);
      const paramCode = urlParams.get('r') || urlParams.get('room') || urlParams.get('peer') || urlParams.get('id');
      if (paramCode) return paramCode.trim().toLowerCase();
      const hash = location.hash.replace(/^#/, '').trim();
      if (hash) return hash.toLowerCase();
      return '';
    }

    function updateStatus(state, label) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      badge.className = 'badge ' + state;
      text.textContent = label;
    }

    function connectMQTT() {
      roomCode = getRoomCode();
      if (!roomCode) {
        document.getElementById('setupView').style.display = 'flex';
        document.getElementById('clickerView').style.display = 'none';
        updateStatus('', 'Esperando código');
        return;
      }

      document.getElementById('setupView').style.display = 'none';
      document.getElementById('clickerView').style.display = 'flex';
      updateStatus('', 'Conectando...');

      if (client) {
        try { client.end(true); } catch (e) {}
      }

      const clientId = 'mui_phone_' + Math.random().toString(16).substring(2, 10);
      client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        clientId: clientId,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2000
      });

      const topicCmd = `mui/deck/${roomCode}/cmd`;
      const topicState = `mui/deck/${roomCode}/state`;
      const topicPing = `mui/deck/${roomCode}/ping`;

      client.on('connect', () => {
        updateStatus('connected', 'Conectado');
        vibrate([30, 40, 30]);
        showToast('🟢 Vinculado a la presentación');

        client.subscribe(topicState, { qos: 0 });
        client.publish(topicPing, JSON.stringify({ t: Date.now(), client: 'phone' }));
      });

      client.on('message', (topic, message) => {
        if (topic === topicState) {
          try {
            const data = JSON.parse(message.toString());
            handleHostData(data);
          } catch (e) {}
        }
      });

      client.on('reconnect', () => {
        updateStatus('', 'Reconectando...');
      });

      client.on('close', () => {
        updateStatus('error', 'Desconectado');
      });

      client.on('error', (err) => {
        console.error('MQTT error:', err);
        updateStatus('error', 'Error red');
      });
    }

    function handleHostData(data) {
      if (typeof data !== 'object') return;

      if (data.slide !== undefined && data.total !== undefined) {
        const s = String(data.slide + 1).padStart(2, '0');
        const t = String(data.total).padStart(2, '0');
        document.getElementById('slideNum').textContent = `${s} / ${t}`;
      }
      if (data.title) {
        document.getElementById('slideTitle').textContent = data.title;
      }
      if (data.step !== undefined && data.steps !== undefined) {
        document.getElementById('slideStep').textContent = data.steps > 0 
          ? `Paso ${data.step} de ${data.steps}` 
          : `Vista general`;
      }

      currentDrawerOpen = data.drawerOpen || null;
      currentDrawersList = data.drawers || [];
      renderDrawers(currentDrawersList, currentDrawerOpen);

      const btnClose = document.getElementById('btnCloseDrawer');
      if (btnClose) {
        btnClose.classList.toggle('highlight', Boolean(currentDrawerOpen));
      }
    }

    function initDrawersListener() {
      const container = document.getElementById('drawersList');
      if (!container || container.dataset.ready) return;
      container.dataset.ready = 'true';
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.drawer-btn');
        if (!btn) return;
        const id = btn.dataset.drawerId;
        if (id) toggleSpecificDrawer(id);
      });
    }

    function renderDrawers(drawers, activeId) {
      initDrawersListener();
      const container = document.getElementById('drawersList');
      const countBadge = document.getElementById('drawersCount');
      if (!container) return;

      countBadge.textContent = String(drawers.length);

      if (!drawers || drawers.length === 0) {
        container.innerHTML = `
          <div class="drawer-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div>Sin desplegables en esta diapositiva</div>
          </div>
        `;
        return;
      }

      let html = '';
      drawers.forEach((d) => {
        const isActive = activeId === d.id;
        html += `
          <button type="button" class="drawer-btn ${isActive ? 'active' : ''}" data-drawer-id="${escapeHtml(d.id)}">
            <div class="drawer-btn-left">
              <div class="drawer-btn-meta">
                ${d.code ? `<span class="drawer-btn-code">${escapeHtml(d.code)}</span>` : ''}
                ${d.chip ? `<span class="drawer-btn-chip">${escapeHtml(d.chip)}</span>` : ''}
              </div>
              <div class="drawer-btn-title">${escapeHtml(d.title)}</div>
            </div>
            <div class="drawer-btn-right">
              <span class="drawer-state-tag">Abierto</span>
              <svg class="drawer-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                ${isActive ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<path d="m9 18 6-6-6-6"/>'}
              </svg>
            </div>
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function toggleSpecificDrawer(id) {
      vibrate(25);
      const isCurrentlyOpen = currentDrawerOpen === id;
      showToast(isCurrentlyOpen ? 'Cerrando detalle...' : 'Abriendo detalle...');
      sendCmd('openDrawer:' + id);
    }

    function sendCmd(action) {
      vibrate(action === 'next' ? 30 : 20);
      if (client && client.connected) {
        client.publish(`mui/deck/${roomCode}/cmd`, action);
      } else {
        showToast('⚠️ Reconectando...');
        connectMQTT();
      }
    }

    function connectManual() {
      const code = document.getElementById('manualCode').value.trim();
      if (!code) {
        showToast('Ingresá el código');
        return;
      }
      location.hash = code.toLowerCase();
      connectMQTT();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    window.addEventListener('load', () => {
      initDrawersListener();
      connectMQTT();
    });
  </script>
</body>
</html>
